plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "rmc-chart" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "EngineHub"
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.sk89q.worldedit:worldedit-fabric-mc${project.minecraft_version}:${project.worldedit_version}"
    implementation "org.yaml:snakeyaml:2.4"
    include "org.yaml:snakeyaml:2.4"
    implementation "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    implementation "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    implementation "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
    implementation "javazoom:jlayer:1.0.1"
    implementation "net.jthink:jaudiotagger:3.0.1"
    include "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    include "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    include "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
    include "javazoom:jlayer:1.0.1"
    include "net.jthink:jaudiotagger:3.0.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// ---- RhythMC ProdTestServer dev workflow ----
// Local Paper/Purpur preview server under ProdTestServer/ (gitignored).
// `runClient` auto-starts it in the background; start is skipped when the
// server port is already open (e.g. server started manually).
// Overrides: -PprodServerPort=25565 -PprodServerXmx=2G
def prodTestServerDir = file("ProdTestServer")
def prodTestServerPort = (findProperty("prodServerPort") ?: "25565").toString().toInteger()
def prodTestServerXmx = (findProperty("prodServerXmx") ?: "2G").toString()
def prodTestServerPidFile = new File(prodTestServerDir, ".gradle-autostart.pid")

def findProdTestServerJar = {
    if (!prodTestServerDir.isDirectory()) {
        return null
    }
    def jars = prodTestServerDir.listFiles({ File dir, String name -> name.endsWith(".jar") } as FilenameFilter)?.toList() ?: []
    if (jars.isEmpty()) {
        return null
    }
    jars.sort { a, b ->
        def rank = { File f ->
            def n = f.name.toLowerCase()
            if (n.startsWith("purpur")) return 0
            if (n.startsWith("paper")) return 1
            return 2
        }
        (rank(a) <=> rank(b)) ?: (b.lastModified() <=> a.lastModified())
    }
    return jars.first()
}

def isProdTestServerPortOpen = { int port ->
    Socket socket = null
    try {
        socket = new Socket()
        socket.connect(new InetSocketAddress("127.0.0.1", port), 500)
        return true
    } catch (IOException ignored) {
        return false
    } finally {
        try {
            socket?.close()
        } catch (IOException ignored) {
        }
    }
}

def prodTestServerJavaBin = {
    def binExt = System.getProperty("os.name").toLowerCase().contains("win") ? ".exe" : ""
    return System.getProperty("java.home") + File.separator + "bin" + File.separator + "java" + binExt
}

def ensureProdTestServerFiles = {
    File eula = new File(prodTestServerDir, "eula.txt")
    if (!eula.isFile()) {
        eula.text = "# Auto-generated by startProdTestServer (local dev only).\neula=true\n"
        logger.lifecycle("ProdTestServer: created {} (eula=true).", eula)
    }
    File props = new File(prodTestServerDir, "server.properties")
    if (!props.isFile()) {
        // Minimal local-dev defaults. The Loom dev client joins offline
        // (PlayerXXX names), so online-mode must be false. Existing files
        // are never overwritten.
        props.text = "# Auto-generated by startProdTestServer because none existed (local dev only).\n"
            + "server-port=${prodTestServerPort}\n"
            + "online-mode=false\n"
            + "motd=RhythMC ProdTestServer (local dev)\n"
            + "max-players=10\n"
        logger.lifecycle("ProdTestServer: created {} with local-dev defaults.", props)
    }
}

tasks.register("startProdTestServer") {
    group = "rhythmc"
    description = "Starts ProdTestServer in the background if its port is free."
    doLast {
        if (isProdTestServerPortOpen(prodTestServerPort)) {
            logger.lifecycle("ProdTestServer: port {} already open, skipping auto-start.", prodTestServerPort)
            return
        }
        if (!prodTestServerDir.isDirectory()) {
            logger.warn("ProdTestServer: directory {} not found, skipping auto-start.", prodTestServerDir)
            return
        }
        File jar = findProdTestServerJar()
        if (jar == null) {
            logger.warn("ProdTestServer: no server jar found in {}, skipping auto-start.", prodTestServerDir)
            return
        }
        ensureProdTestServerFiles()
        new File(prodTestServerDir, "logs").mkdirs()
        File outLog = new File(prodTestServerDir, "logs/gradle-autostart.log")
        List<String> cmd = [prodTestServerJavaBin(), "-Xms1G", "-Xmx" + prodTestServerXmx, "-jar", jar.absolutePath, "--nogui"]
        ProcessBuilder pb = new ProcessBuilder(cmd)
        pb.directory(prodTestServerDir)
        pb.redirectOutput(ProcessBuilder.Redirect.appendTo(outLog))
        pb.redirectErrorStream(true)
        pb.redirectInput(ProcessBuilder.Redirect.PIPE)
        Process proc = pb.start()
        try {
            proc.getOutputStream().close()
        } catch (IOException ignored) {
            // Server stdin stays open; harmless for a background process.
        }
        prodTestServerPidFile.text = Long.toString(proc.pid())
        logger.lifecycle("ProdTestServer: started {} (pid {}, port {}), log: {}", jar.name, proc.pid(), prodTestServerPort, outLog)
        Thread.sleep(3000)
        if (!proc.isAlive()) {
            logger.warn("ProdTestServer: process exited early with code {}. Check {}.", proc.exitValue(), outLog)
            prodTestServerPidFile.delete()
            return
        }
        long deadline = System.currentTimeMillis() + 90_000
        while (System.currentTimeMillis() < deadline) {
            if (isProdTestServerPortOpen(prodTestServerPort)) {
                logger.lifecycle("ProdTestServer: port {} is open.", prodTestServerPort)
                return
            }
            if (!proc.isAlive()) {
                logger.warn("ProdTestServer: process died during boot (code {}). Check {}.", proc.exitValue(), outLog)
                prodTestServerPidFile.delete()
                return
            }
            Thread.sleep(2000)
        }
        logger.warn("ProdTestServer: port {} not open after 90s, continuing anyway. Check {}.", prodTestServerPort, outLog)
    }
}

tasks.register("runProdTestServer", Exec) {
    group = "rhythmc"
    description = "Runs ProdTestServer in the foreground (blocking, console attached)."
    standardInput = System.in
    doFirst {
        if (!prodTestServerDir.isDirectory()) {
            throw new GradleException("ProdTestServer directory not found: ${prodTestServerDir}")
        }
        File jar = findProdTestServerJar()
        if (jar == null) {
            throw new GradleException("No server jar found in ${prodTestServerDir}")
        }
        ensureProdTestServerFiles()
        workingDir prodTestServerDir
        commandLine prodTestServerJavaBin(), "-Xms1G", "-Xmx" + prodTestServerXmx, "-jar", jar.absolutePath, "--nogui"
    }
}

tasks.register("stopProdTestServer") {
    group = "rhythmc"
    description = "Stops the background ProdTestServer started by startProdTestServer."
    doLast {
        if (!prodTestServerPidFile.isFile()) {
            logger.lifecycle("ProdTestServer: no pid file, nothing to stop (was it started manually?).")
            return
        }
        long pid = prodTestServerPidFile.text.trim().toLong()
        def handle = ProcessHandle.of(pid)
        if (handle.isEmpty()) {
            logger.lifecycle("ProdTestServer: pid {} is not running.", pid)
            prodTestServerPidFile.delete()
            return
        }
        handle.get().destroy()
        long deadline = System.currentTimeMillis() + 15_000
        while (System.currentTimeMillis() < deadline) {
            if (!handle.get().isAlive()) {
                break
            }
            Thread.sleep(500)
        }
        if (handle.get().isAlive()) {
            handle.get().destroyForcibly()
            logger.lifecycle("ProdTestServer: pid {} force-killed.", pid)
        } else {
            logger.lifecycle("ProdTestServer: pid {} stopped.", pid)
        }
        prodTestServerPidFile.delete()
    }
}

tasks.named("runClient") {
    dependsOn("startProdTestServer")
}
